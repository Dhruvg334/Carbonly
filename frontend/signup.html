<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Carbonly Intelligence Platform</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--mint-light);">

    <main class="card-neo" style="width: 100%; max-width: 440px; background: #FFFFFF; padding: 36px;">
        <div style="text-align: center; margin-bottom: 28px;">
            <a href="index.html" class="logo" style="justify-content: center; font-size: 1.8rem; margin-bottom: 8px;">
                <img src="assets/icon.svg" alt="Carbonly Logo"> Carbonly
            </a>
            <span class="badge-neo badge-neo-scope1">Create New Account</span>
        </div>

        <form id="signupForm" onsubmit="event.preventDefault(); handleSignup();" style="display: flex; flex-direction: column; gap: 16px;">
            <div>
                <label style="display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 6px;">Username</label>
                <input type="text" id="username" placeholder="Choose a username" required>
            </div>

            <div>
                <label style="display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 6px;">Email Address</label>
                <input type="email" id="email" placeholder="name@company.com" required>
            </div>

            <div>
                <label style="display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 6px;">Password</label>
                <input type="password" id="password" placeholder="At least 6 chars with 1 letter & 1 number" required>
            </div>

            <button type="submit" class="btn-neo btn-neo-primary" style="width: 100%; margin-top: 8px;">Create Account</button>
        </form>

        <div style="text-align: center; margin-top: 24px; font-size: 0.85rem; color: var(--text-muted);">
            Already have an account? <a href="login.html" style="color: var(--emerald); font-weight: 700; text-decoration: none;">Log In</a>
        </div>
    </main>

    <script src="toast.js"></script>
    <script>
        async function handleSignup() {
            const username = document.getElementById("username").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            try {
                const res = await fetch("http://localhost:5000/api/auth/register", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, email, password })
                });

                const data = await res.json();

                if (res.ok) {
                    showToast("Account created successfully! Redirecting to login...", "success");
                    setTimeout(() => {
                        window.location.href = "login.html";
                    }, 1500);
                } else {
                    showToast(data.message || "Registration failed", "error");
                }
            } catch (err) {
                showToast("Network error connecting to API server", "error");
            }
        }
    </script>
</body>
</html>
