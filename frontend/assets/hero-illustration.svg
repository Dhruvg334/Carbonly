<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <!-- Backdrop Glow Shadow -->
  <ellipse cx="300" cy="380" rx="240" ry="40" fill="#0B3D2E" opacity="0.12"/>
  
  <!-- Isometric Laptop Base -->
  <path d="M 120 320 L 440 320 L 510 370 L 50 370 Z" fill="#E2ECE9" stroke="#0B3D2E" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 50 370 L 510 370 L 510 380 L 50 380 Z" fill="#2D6A4F" stroke="#0B3D2E" stroke-width="4" stroke-linejoin="round"/>
  <rect x="230" y="372" width="60" height="4" rx="2" fill="#FFFFFF"/>

  <!-- Isometric Laptop Screen Frame -->
  <path d="M 140 100 L 460 100 L 440 320 L 120 320 Z" fill="#FFFFFF" stroke="#0B3D2E" stroke-width="5" stroke-linejoin="round"/>
  <!-- Screen Display Inner -->
  <path d="M 152 114 L 448 114 L 430 308 L 134 308 Z" fill="#F4F9F5" stroke="#0B3D2E" stroke-width="3"/>

  <!-- Screen UI Element 1: Header Bar -->
  <path d="M 152 114 L 448 114 L 444 140 L 150 140 Z" fill="#2D6A4F" stroke="#0B3D2E" stroke-width="2"/>
  <circle cx="168" cy="127" r="4" fill="#FF6B6B"/>
  <circle cx="182" cy="127" r="4" fill="#FFD166"/>
  <circle cx="196" cy="127" r="4" fill="#B7E4C7"/>
  <rect x="360" y="122" width="70" height="10" rx="4" fill="#FFFFFF" opacity="0.8"/>

  <!-- Screen UI Element 2: Donut Chart -->
  <g transform="translate(220, 210)">
    <circle cx="0" cy="0" r="42" fill="none" stroke="#B7E4C7" stroke-width="16"/>
    <path d="M 0 -42 A 42 42 0 0 1 40 12" fill="none" stroke="#2D6A4F" stroke-width="16"/>
    <path d="M 40 12 A 42 42 0 0 1 -32 28" fill="none" stroke="#FFD166" stroke-width="16"/>
    <circle cx="0" cy="0" r="24" fill="#FFFFFF" stroke="#0B3D2E" stroke-width="2"/>
  </g>

  <!-- Screen UI Element 3: Bar Graphs -->
  <g transform="translate(310, 160)">
    <rect x="0" y="0" width="115" height="110" rx="6" fill="#FFFFFF" stroke="#0B3D2E" stroke-width="2"/>
    <rect x="14" y="55" width="18" height="45" rx="3" fill="#2D6A4F"/>
    <rect x="42" y="30" width="18" height="70" rx="3" fill="#B7E4C7" stroke="#0B3D2E" stroke-width="1.5"/>
    <rect x="70" y="45" width="18" height="55" rx="3" fill="#FFD166" stroke="#0B3D2E" stroke-width="1.5"/>
    <line x1="8" y1="102" x2="108" y2="102" stroke="#0B3D2E" stroke-width="2"/>
  </g>

  <!-- Floating 3D Eco Badge Element (Left Side) -->
  <g transform="translate(70, 180)">
    <rect x="0" y="0" width="90" height="75" rx="10" fill="#FFFFFF" stroke="#0B3D2E" stroke-width="3"/>
    <rect x="10" y="12" width="70" height="14" rx="4" fill="#B7E4C7"/>
    <text x="45" y="23" font-family="Inter, sans-serif" font-size="8" font-weight="800" fill="#0B3D2E" text-anchor="middle">5-STAR RATING</text>
    <text x="45" y="52" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#2D6A4F" text-anchor="middle">920 pts</text>
  </g>

  <!-- Floating Eco Coin Elements (Right Side) -->
  <g transform="translate(480, 240)">
    <circle cx="20" cy="20" r="22" fill="#FFD166" stroke="#0B3D2E" stroke-width="3"/>
    <circle cx="20" cy="20" r="16" fill="none" stroke="#0B3D2E" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="20" y="26" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#0B3D2E" text-anchor="middle">$</text>
  </g>
  
  <g transform="translate(450, 310)">
    <circle cx="18" cy="18" r="18" fill="#B7E4C7" stroke="#0B3D2E" stroke-width="3"/>
    <path d="M12 22 C10 14, 16 10, 24 12 C28 20, 22 26, 12 22 Z" fill="#2D6A4F" stroke="#0B3D2E" stroke-width="1.5"/>
  </g>
</svg>
