<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Carbonly Intelligence Platform</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--mint-light);">

    <main class="card-neo" style="width: 100%; max-width: 420px; background: #FFFFFF; padding: 36px;">
        <div style="text-align: center; margin-bottom: 28px;">
            <a href="index.html" class="logo" style="justify-content: center; font-size: 1.8rem; margin-bottom: 8px;">
                <img src="assets/icon.svg" alt="Carbonly Logo"> Carbonly
            </a>
            <span class="badge-neo badge-neo-scope2">Secure Gateway Login</span>
        </div>

        <form id="loginForm" onsubmit="event.preventDefault(); handleLogin();" style="display: flex; flex-direction: column; gap: 16px;">
            <div>
                <label style="display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 6px;">Username</label>
                <input type="text" id="username" placeholder="Enter your username" required>
            </div>

            <div>
                <label style="display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 6px;">Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem;">
                <a href="forgot-password.html" style="color: var(--emerald); font-weight: 700; text-decoration: none;">Forgot Password?</a>
            </div>

            <button type="submit" class="btn-neo btn-neo-primary" style="width: 100%; margin-top: 8px;">Log In</button>
        </form>

        <div style="text-align: center; margin-top: 24px; font-size: 0.85rem; color: var(--text-muted);">
            Don't have an account? <a href="signup.html" style="color: var(--emerald); font-weight: 700; text-decoration: none;">Sign Up</a>
        </div>
    </main>

    <script src="toast.js"></script>
    <script>
        async function handleLogin() {
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;

            try {
                const res = await fetch("http://localhost:5000/api/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (res.ok && data.token) {
                    localStorage.setItem("token", data.token);
                    showToast("Login successful! Redirecting to dashboard...", "success");
                    setTimeout(() => {
                        window.location.href = "dashboard.html";
                    }, 1200);
                } else {
                    showToast(data.message || "Invalid credentials", "error");
                }
            } catch (err) {
                showToast("Network error connecting to API server", "error");
            }
        }
    </script>
</body>
</html>
